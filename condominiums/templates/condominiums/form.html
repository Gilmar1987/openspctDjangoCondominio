{% extends "base.html" %}
{% block title %}Novo condomínio — controleCondominio{% endblock %}
{% block content %}
  <div class="breadcrumb"><a href="{% url 'condominiums:list' %}">Condomínios</a></div>
  <h1>Novo condomínio</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="field">
      <label for="name">Nome</label>
      <input id="name" name="name" type="text" value="{{ values.name|default:'' }}">
      {% if errors.name %}
        <ul class="field-error">{% for error in errors.name %}<li>{{ error }}</li>{% endfor %}</ul>
      {% endif %}
    </div>
    <button type="submit">Salvar</button>
    <a class="button secondary" href="{% url 'condominiums:list' %}">Cancelar</a>
  </form>
{% endblock %}
