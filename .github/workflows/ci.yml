name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: controle_condominio
          POSTGRES_USER: controle_condominio
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controle_condominio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valores apenas de teste; não são segredos.
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      FIELD_ENCRYPTION_KEY: IoayGRJEvebKkydbs6Vcu3o-mShuxfRNDFscf9E0BAo=
      CPF_HASH_KEY: ci-only-not-secret-hash-key
      POSTGRES_DB: controle_condominio
      POSTGRES_USER: controle_condominio
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Bloqueante (ADR-0018): falha se alguma dependência tiver vulnerabilidade conhecida.
      # Exceção só com --ignore-vuln <ID>, comentando aqui o motivo e a data de revisão.
      - name: Auditoria de dependências
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Testes unitários com cobertura do domínio
        run: pytest --cov --cov-config=.coveragerc --cov-report=term-missing
