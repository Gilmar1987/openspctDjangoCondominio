schema: spec-driven

context: |
  Language: pt-BR
  Escreva os artefatos em pt-BR, salvo quando o projeto consumidor definir outro idioma.
  Preserve os títulos estruturais do OpenSpec e as palavras-chave SHALL/MUST em inglês.

  Projeto: controleCondominio — cadastro de proprietários, seus apartamentos e
  moradores. Público misto (B2B2C), MVP pequeno (até 100 usuários ativos), multi-tenant
  por coluna tenant_id, trata dados pessoais sujeitos à LGPD. Detalhes em
  openspec/project.md e openspec/project-setup.md.

  Arquitetura: monólito Django em Vertical Slices (uma fatia por feature, com seu
  handler); regras de negócio em Domain Model rico (DDD); módulos se comunicam por
  REST/HTTP, sem importar internals de outra fatia; monorepo.

  Stack: Python + Django + Django REST Framework; front-end renderizado pelo próprio
  Django; PostgreSQL self-hosted em contêiner; Django ORM; validação com Pydantic;
  filas com Celery (broker Redis ou RabbitMQ, a decidir); dependências via pip +
  requirements.txt; execução local via docker-compose. Sem autenticação no MVP.
  Sem deploy em produção; apenas ambiente de desenvolvimento local; secrets em .env.

  Convenções: código em inglês, textos de interface em pt-BR (sem i18n). GitHub Flow
  com PR para main; PR exige aprovação + CI verde (GitHub Actions rodando testes
  unitários). Pytest; 100% de cobertura nos módulos de domínio com TDD estrito; sem
  testes E2E. Logs em stdout, sem monitoramento de erros nem tracing.

  Dados pessoais: todo tenant_id MUST ser filtrado em consultas; dados pessoais MUST
  ser anonimizados em logs e relatórios; campos sensíveis (ex.: CPF) MUST ser
  criptografados na aplicação. Sem proteção contra ataques no MVP.

  Se uma decisão necessária estiver ausente, pergunte ou registre explicitamente a
  suposição no artefato pertinente.

  Toda mudança de comportamento deve ser planejada antes da implementação. Aplique
  as convenções e ferramentas reais do projeto consumidor; não introduza dependências
  ou padrões de implementação sem justificativa nos artefatos da change.

  Decisões de arquitetura duradouras ficam em openspec/adrs/. ADRs com status Accepted
  são restrições vigentes; contrariá-las exige uma nova ADR que as substitua.

  Disciplina de contexto: leia por inteiro, sem resumir, config.yaml, project.md, as
  ADRs Accepted relevantes, os artefatos da change, as specs afetadas e o código
  antes de alterá-lo. Filtre só saídas volumosas (logs, build, testes, JSON/CSV
  grandes). Toda verificação reportada traz o comando e o resultado; sem saída, é
  "não verificado". Economia de tokens nunca justifica pular leitura, marcar tarefa
  sem verificação ou declarar sucesso sem evidência.

rules:
  proposal:
    - Explicar o problema, o resultado esperado e declarar explicitamente o que está fora do escopo
    - Identificar dependências, riscos e impactos relevantes para o projeto consumidor
    - "Incluir uma seção de riscos que responda, marcando Não aplicável com justificativa quando for o caso: a change coleta, expõe, registra em log ou retém dados pessoais ou sensíveis (ex.: LGPD/GDPR)? Altera autenticação, autorização ou superfície exposta? Altera esquema, volume ou padrão de acesso a dados? Exige configuração, segredo ou variável de ambiente nova em algum ambiente? Quebra compatibilidade com clientes, integrações ou dados existentes?"
    - "Terminar com a seção ## Aprovação, sem checkboxes, em itens de lista: Responsável (Pendente até o usuário aprovar), Data, Escopo (apply ou archive), Condições (só para archive) e Origem (citação da declaração explícita do usuário). Nunca preencher a aprovação sem essa declaração"
  specs:
    - Escrever requisitos observáveis, sem prescrever implementação desnecessariamente
    - Todo requisito deve ter ao menos um cenário verificável, incluindo erros e limites quando relevantes
  design:
    - Registrar decisões técnicas relevantes, alternativas consideradas e consequências
    - Respeitar a arquitetura e as tecnologias registradas pelo projeto consumidor
    - Citar as ADRs Accepted que se aplicam; se o design contrariar uma delas ou tomar uma decisão transversal nova, indicar a ADR a criar ou substituir
    - "Para cada risco marcado como aplicável na proposal, descrever a mitigação (ex.: mascaramento em log, índice, migração, plano de rollback, criação prévia da configuração)"
    - "Listar o raio de impacto: arquivos-alvo (que serão alterados) e dependentes afetados (arquivos, rotas ou componentes que usam os alvos e podem quebrar)"
  tasks:
    - Dividir o trabalho em tarefas pequenas e ordenadas por dependência
    - Cada tarefa deve informar um critério objetivo de conclusão ou validação
    - Incluir tarefas explícitas para cada mitigação de risco do design e para criar ou atualizar as ADRs indicadas
    - Citar em cada tarefa os arquivos que ela toca
    - Em cada grupo, a tarefa que cria ou atualiza os testes dos cenários vem antes da tarefa que implementa o comportamento

operations:
  apply:
    guidance:
      - Consultar todos os artefatos de planejamento antes de implementar
      - Usar ferramentas de teste, lint e build existentes no projeto consumidor
      - Cobrir cenários de interface com verificação em navegador versionada no repositório, já que o projeto decidiu não ter E2E
      - Não marcar uma tarefa concluída enquanto o critério de validação não tiver sido atendido
      - "Antes de alterar código, conferir a seção ## Aprovação do proposal: sem ela, ou com Responsável Pendente, parar e pedir a aprovação ao usuário"
      - "Depois de 3 tentativas seguidas falhando no mesmo erro ou teste, parar, mostrar as tentativas e pedir orientação; se for preciso alterar mais de 5 arquivos fora do raio de impacto, parar e pedir confirmação"
  archive:
    guidance:
      - Executar /opsx:verify antes de arquivar e registrar eventuais limitações
      - Revisar as delta specs e o impacto esperado em openspec/specs/ antes de arquivar
      - O arquivamento consolida as delta specs na fonte da verdade; conferir o resultado depois
